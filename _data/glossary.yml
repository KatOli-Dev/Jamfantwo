# Glossary of in-universe terms.
# Each entry must have a `term` (the headword), a `definition` (short explanation),
# and a `url` linking to the page that defines or discusses the term in depth.
# Entries are sorted alphabetically on the generated page.

- term: Moon-Weave
  definition: A pattern of influence that passes across the world with the moon's motion, believed to affect resonance and the disposition of living things.
  url: /content/mythology/the-moon-weave/

- term: The Art
  definition: The disciplined practice of reading and reshaping pattern through resonance.
  url: /content/magic/magic-overview/

- term: Deep Mourning
  definition: A period of formal grief observed among several peoples, marked by specific rites and customs.
  url: /content/culture/deep-mourning/

- term: First Kindling
  definition: A ritual fire-lighting ceremony that marks the beginning of winter in several northern communities.
  url: /content/culture/first-kindling/

- term: First-Grain Feast
  definition: A harvest celebration held after the first grain of the season is reaped.
  url: /content/culture/first-grain-feast/

- term: First-Hunt Rite
  definition: A coming-of-age ceremony in which a young hunter takes their first large game.
  url: /content/culture/first-hunt-rite/

- term: Hearth-Hall
  definition: The central communal building of a dwarven settlement, serving as a gathering place and seat of governance.
  url: /content/culture/dwarven-hall-life/

- term: Houses of Memory
  definition: Religious institutions dedicated to the preservation and recitation of ancestral histories.
  url: /content/religion/houses-of-memory/

- term: The Kharesh
  definition: The vast desert that covers much of the interior of Sahrana, traversed by ancient caravan routes.
  url: /content/location/natural/feature/kharesh

- term: Pattern
  definition: The substance of order upon which the Art operates; the arrangement of all things in relation to one another.
  url: /content/magic/law/medium/

- term: Plains' High Days
  definition: Seasonal festivals observed by the horse-herding peoples of the grasslands.
  url: /content/culture/plains-high-days/

- term: Relic
  definition: An object whose pattern has been deeply reshaped by repeated workings of the Art.
  url: /content/magic/magic-overview/

- term: Resonance
  definition: The principle by which like things act upon like, the foundation of the Art.
  url: /content/magic/resonance-theory/

- term: Salt Caravan Festival
  definition: A celebration held when the salt caravans arrive in Sahrani towns, marking the end of a trading season.
  url: /content/culture/salt-caravan-festival/

- term: Shoreline Vigil
  definition: A coastal rite in which communities watch the sea for returning fishing fleets.
  url: /content/culture/shoreline-vigil/

- term: Sky Walkers' Way
  definition: A tradition of meditation and physical discipline practised by the monastic communities of the high peaks.
  url: /content/culture/sky-walkers-way/

- term: The Still Flame
  definition: A religious order that tends an eternal flame, representing endurance and continuity.
  url: /content/religion/still-flame/

- term: Stone Song Festival
  definition: A dwarven festival in which stone-carvers and masons display their craft and compete in skill.
  url: /content/culture/stone-song-festival/

- term: The Veil
  definition: The boundary between the material world and unseen realms, a concept central to several religious traditions.
  url: /content/mythology/the-first-veil/

- term: Winter Telling
  definition: A season of storytelling and oral history passed down during the long winter months.
  url: /content/culture/winter-telling/

- term: Working
  definition: A single named act of the Art, performed on a particular pattern through a particular discipline.
  url: /content/magic/working-types/
