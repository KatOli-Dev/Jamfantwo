name: Deploy to GitHub Pages

on:
  push:
    paths-ignore:
      - '.claude/**'
      - '.opencode/**'
      - 'opencode.json'
      - 'temp/**'
      - '.gitignore'
      - '.githooks/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the repository's configured default branch is production.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          JEKYLL_ENV: production
          JEKYLL_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --strict_front_matter

      - name: Validate content
        run: ruby scripts/validate_content.rb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
