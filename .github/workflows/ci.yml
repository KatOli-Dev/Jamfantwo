name: CI
on:
  push:
    branches: [main, master, development]
    paths-ignore:
      - '.claude/**'
      - '.opencode/**'
      - 'opencode.json'
      - 'temp/**'
      - '.gitignore'
      - '.githooks/**'
  pull_request:
    branches: [main, master, development]
    paths-ignore:
      - '.claude/**'
      - '.opencode/**'
      - 'opencode.json'
      - 'temp/**'
      - '.gitignore'
      - '.githooks/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Jekyll strict build
        run: bundle exec jekyll build --strict_front_matter
      - name: Run content validator
        run: ruby scripts/validate_content.rb
