# Validator exception configuration
#
# Overrides for the article (a/an) rules in scripts/validate_content.rb.
# English pronunciation sometimes diverges from spelling, so a strict
# letter-based check would flag correct prose. Each pattern here marks
# a word prefix where the article choice is reversed from the default.

article_exceptions:
  # Words where "a" is correct even though the first letter is a vowel.
  # Patterns are matched against the start of the word, case-insensitive.
  a_before_vowel:
    - pattern: 'eu'
      note: 'eu- words (euphoria, ewe) where the second letter carries the vowel'
    - pattern: 'ew'
      note: 'ew- words (ewer) where the w makes the consonant sound'
    - pattern: 'one'
      note: 'one, where the o is pronounced /w/'
    - pattern: 'once'
      note: 'once, where the o is pronounced /w/'
    - pattern: 'un[iu]'
      note: 'unicorn, university, unified, union, etc. where u is /j/'
    - pattern: 'use'
      note: 'useful, useless, user, usual, etc. where u is /j/'
    - pattern: 'us'
      note: 'usurper, usury, usurpation, etc. where u is /j/'

  # Words where "an" is correct even though the first letter is a consonant.
  # Patterns are matched against the start of the word, case-insensitive.
  an_before_consonant:
    - pattern: 'h[aeiou]'
      note: 'silent-h words (heir, hour, honest, honor) where h is not pronounced'

# Overrides for the link text / page title matcher.
# Each entry is a regex matched against the raw link text. If any pattern
# matches, the link is accepted as canonical for any target page. Use this
# for variations the fuzzy matcher cannot resolve (singular/plural pairs,
# hyphenation variants, abbreviations, etc.).

link_text_exceptions:
  universal:
    - pattern: '\Aelf\z'
      note: 'singular "elf" accepted for the plural "Elves" page'
    - pattern: '\Aorc\z'
      note: 'singular "orc" accepted for the plural "Orcs" page'
    - pattern: 'Storm-Petrel'
      note: 'hyphenated compound accepted alongside the space-separated "The Storm Petrel"'
    - pattern: '\Amoney-changers\z'
      note: 'colloquial term for the dealers in currency and exchange'

# Style constraints: patterns banned by the content-page skill.
# Each entry is a regex matched against a single body line. If any pattern
# matches, the validator emits a failure with the provided note.
style_constraints:
  address_reader:
    - pattern: '\byou\b'
      note: 'second-person pronoun addresses the reader directly'
    - pattern: '\byour\b'
      note: 'second-person possessive addresses the reader directly'
    - pattern: '\byourself\b'
      note: 'second-person reflexive addresses the reader directly'
    - pattern: '\bdear reader\b'
      note: 'direct address to the reader "dear reader"'
    - pattern: '\bin our world\b'
      note: 'references the real world ("our world")'
    - pattern: '\bthe real world\b'
      note: 'references the real world ("the real world")'
    - pattern: '\bon earth\b'
      note: 'references Earth ("on earth") — use in-world geography'

  anachronistic_terms:
    - pattern: '\bcomputer\b'
      note: 'anachronistic term'
    - pattern: '\binternet\b'
      note: 'anachronistic term'
    - pattern: '\bwebsite\b'
      note: 'anachronistic term'
    - pattern: '\bemail\b'
      note: 'anachronistic term'
    - pattern: '\blaptop\b'
      note: 'anachronistic term'
    - pattern: '\bcell.?phone\b'
      note: 'anachronistic term'
    - pattern: '\btelevision\b'
      note: 'anachronistic term'
    - pattern: '\belectricity\b'
      note: 'anachronistic term'
    - pattern: '\bvideo\b'
      note: 'anachronistic term'
    - pattern: '\bnuclear\b'
      note: 'anachronistic term'
    - pattern: '\bradio\b'
      note: 'anachronistic term'
    - pattern: '\bautomobile\b'
      note: 'anachronistic term'
    - pattern: '\btelephone\b'
      note: 'anachronistic term'
