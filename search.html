---
layout: default
title: Search
---

<div id="js-search">
  <form id="search-form" role="search" aria-label="Site search">
    <label for="search-input">
      Search the archive
    </label>
    <input
      type="text"
      id="search-input"
      placeholder="Type to search…"
      autocomplete="off"
      aria-describedby="search-hint"
    >
    <span id="search-hint">
      Search across all pages by title and text
    </span>
  </form>

  <div id="search-results" aria-live="polite"></div>

  <script>
    (function() {
      var index = null;
      var input = document.getElementById('search-input');
      var results = document.getElementById('search-results');

      function loadIndex() {
        if (index) return Promise.resolve(index);
        return fetch('/assets/search-index.json')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            index = data;
            return data;
          });
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // --- fuzzy matching helpers ---

      // Compute character bigram set for a string.
      function bigrams(s) {
        var set = {};
        for (var i = 0; i < s.length - 1; i++) {
          set[s.substring(i, i + 2)] = true;
        }
        return set;
      }

      // Dice coefficient over character bigrams (0..1).
      function dice(a, b) {
        var ba = bigrams(a);
        var bb = bigrams(b);
        var intersect = 0;
        for (var k in ba) if (bb[k]) intersect++;
        var total = Object.keys(ba).length + Object.keys(bb).length;
        return total === 0 ? 1 : (2 * intersect) / total;
      }

      // Levenshtein edit distance.
      function levenshtein(a, b) {
        var m = a.length, n = b.length;
        var prev = new Array(n + 1);
        var cur = new Array(n + 1);
        for (var j = 0; j <= n; j++) prev[j] = j;
        for (var i = 1; i <= m; i++) {
          cur[0] = i;
          for (var j = 1; j <= n; j++) {
            cur[j] = a[i - 1] === b[j - 1]
              ? prev[j - 1]
              : 1 + Math.min(prev[j], cur[j - 1], prev[j - 1]);
          }
          var tmp = prev; prev = cur; cur = tmp;
        }
        return prev[n];
      }

      // Score how well a single query term matches a text segment (0..1).
      // 1.0 = exact substring match (word boundary preferred).
      function termScore(term, text) {
        if (term.length === 0) return 0;
        var idx = text.indexOf(term);
        if (idx !== -1) {
          // boundary bonus: term starts at word boundary or text start
          var boundary = idx === 0 || text[idx - 1] === ' ';
          return boundary ? 1.0 : 0.95;
        }
        // Short terms (<4 chars) don't get fuzzy — too many false positives.
        if (term.length < 4) return 0;
        var diceScore = dice(term, text);
        if (diceScore > 0.4) {
          var maxDist = Math.max(1, Math.floor(term.length / 3));
          var dist = levenshtein(term, text.substring(0, Math.min(text.length, term.length + maxDist + 2)));
          var fuzzyPenalty = dist <= maxDist ? 0.15 * dist : 0.5;
          return Math.max(0, Math.min(1, diceScore - fuzzyPenalty));
        }
        return 0;
      }

      // Highlight all occurrences of query terms in text by wrapping with <mark>.
      function highlight(text, terms) {
        if (!terms || terms.length === 0) return escapeHtml(text);
        var lower = text.toLowerCase();
        var ranges = [];
        terms.forEach(function(term) {
          var idx = 0;
          while (idx < lower.length) {
            var pos = lower.indexOf(term, idx);
            if (pos === -1) break;
            ranges.push({ start: pos, end: pos + term.length });
            idx = pos + 1;
          }
        });
        if (ranges.length === 0) return escapeHtml(text);
        ranges.sort(function(a, b) { return a.start - b.start; });
        var merged = [ranges[0]];
        for (var i = 1; i < ranges.length; i++) {
          var last = merged[merged.length - 1];
          if (ranges[i].start <= last.end) {
            last.end = Math.max(last.end, ranges[i].end);
          } else {
            merged.push(ranges[i]);
          }
        }
        var out = '';
        var cursor = 0;
        merged.forEach(function(r) {
          out += escapeHtml(text.substring(cursor, r.start));
          out += '<mark>' + escapeHtml(text.substring(r.start, r.end)) + '</mark>';
          cursor = r.end;
        });
        out += escapeHtml(text.substring(cursor));
        return out;
      }

      function renderResults(query, data) {
        if (!query || query.length < 1) {
          results.innerHTML = '';
          return;
        }

        var rawTerms = query.toLowerCase().split(/\s+/).filter(function(t) { return t.length > 0; });
        if (rawTerms.length === 0) {
          results.innerHTML = '';
          return;
        }

        var scored = [];

        for (var i = 0; i < data.length; i++) {
          var entry = data[i];
          var titleLower = entry.title.toLowerCase();
          var snippetLower = entry.snippet.toLowerCase();
          var total = 0;

          for (var t = 0; t < rawTerms.length; t++) {
            var term = rawTerms[t];
            var titleScore = termScore(term, titleLower);
            var snippetScore = termScore(term, snippetLower);
            var termMax = Math.max(titleScore, snippetScore);
            // require at least one term to have a good match
            if (termMax < 0.35) { total = -1; break; }
            total += termMax;
          }

          if (total > 0) {
            scored.push({ entry: entry, score: total / rawTerms.length });
          }
        }

        scored.sort(function(a, b) { return b.score - a.score; });

        if (scored.length === 0) {
          results.innerHTML = '<p>No results found.</p>';
          return;
        }

        var html = '<p>' + scored.length + ' page' + (scored.length === 1 ? '' : 's') + ' found</p>';
        for (var j = 0; j < scored.length; j++) {
          var m = scored[j].entry;
          var highlightedTitle = highlight(m.title, rawTerms);
          var snippetText = m.snippet.substring(0, 300);
          var highlightedSnippet = highlight(snippetText, rawTerms);
          html += '<article>' +
            '<a href="' + m.url + '">' + highlightedTitle + '</a>' +
            '<p>' + highlightedSnippet + '</p>' +
            '</article>';
        }
        results.innerHTML = html;
      }

      input.addEventListener('input', function() {
        loadIndex().then(function(data) {
          renderResults(input.value, data);
        });
      });
    })();
  </script>
</div>

<noscript>
  <p>
    Search requires JavaScript.
  </p>
</noscript>
