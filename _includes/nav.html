<nav aria-label="Primary">
  <div class="nav-row">
    <a href="{{ '/' | relative_url }}" class="brand">
      {{site.title}}
    </a>
    <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
  </div>
  <div class="nav-menu">
    <ul>
      <li class="dropdown">
        <button type="button" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
          Categories
          <svg class="dropdown-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul class="dropdown-menu" aria-label="Site categories">
          {%- for group in site.data.navigation.groups %}
          <li class="dropdown-group">
            <span class="dropdown-group-label">{{ group.label }}</span>
            <ul>
              {%- for item in group.items %}
              <li>
                <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
              </li>
              {%- endfor %}
            </ul>
          </li>
          {%- endfor %}
        </ul>
      </li>
      <li>
        <a href="{{ '/search/' | relative_url }}" class="js-search-link">Search</a>
      </li>
      <li>
        <a href="{{ '/license/' | relative_url }}">License</a>
      </li>
      <li>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light theme">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </li>
    </ul>
  </div>
</nav>
